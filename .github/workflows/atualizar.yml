name: Gerar Video IPTV

on:
  schedule:
    - cron: '0 * * * *' # Roda a cada 1 hora
  workflow_dispatch: # Permite rodar manualmente

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Rodar Script
        run: python gerar.py

      - name: Enviar debug como artifact do workflow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-relatorio
          path: debug_relatorio.txt
          retention-days: 7

      - name: Salvar Video e Imagem no Repositório
        run: |
          git config --global user.name 'Bot IPTV'
          git config --global user.email 'bot@noreply.github.com'
          # Adiciona o vídeo, as imagens geradas e o debug
          git add video_status.mp4 status_*.png debug_relatorio.txt
          git commit -m "Atualizando status video" || echo "Nada mudou"
          git push
